<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Snap Pop Browser Runtime Smoke</title></head>
<body data-status="PENDING">
<pre id="result">BROWSER_RUNTIME_SMOKE_PENDING</pre>
<iframe id="app" src="../index.html?runtime-smoke=1" style="width:390px;height:844px;border:0"></iframe>
<script>
const result=document.getElementById("result");
const frame=document.getElementById("app");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(check,timeout=10000,interval=100){
  const started=Date.now();
  while(Date.now()-started<timeout){
    try{if(check())return true}catch{}
    await wait(interval);
  }
  return false;
}
function assert(name,condition){
  if(!condition) throw new Error("FAIL "+name);
  result.textContent+="\nPASS "+name;
}
function click(el,name){assert(name+"-exists",!!el);el.click()}
async function run(){
  try{
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error("FAIL app-load-timeout")),12000);
      frame.addEventListener("load",()=>{clearTimeout(timer);resolve()},{once:true});
    });
    const w=frame.contentWindow,d=frame.contentDocument;
    assert("app-shell-loaded",!!d.querySelector("#app"));
    assert("shared-release-loaded",!!w.SnapPopReleaseDescriptor&&w.SnapPopReleaseDescriptor.app_id==="snap-pop");
    assert("shared-pwa-loaded",!!w.SnapPopPwaUpdate&&w.SnapPopPwaUpdate.capability==="CAP-PWA-UPDATE-001");
    assert("shared-event-envelope-loaded",!!w.TakyEventEnvelope&&typeof w.TakyEventEnvelope.create==="function");
    assert("initial-pwa-safe-point",w.SnapPopPwaSafePoint?.()===true);
    const landmarksReady=await waitFor(()=>d.querySelectorAll("#landmarks .landmark").length===5,10000,120);
    if(!landmarksReady){
      const toast=d.querySelector("#toast")?.textContent||"";
      const runtime=w.__SNAP_RUNTIME_STATUS||null; throw new Error("FAIL map-has-five-landmarks count="+d.querySelectorAll("#landmarks .landmark").length+" readyState="+d.readyState+" toast="+toast+" runtime="+JSON.stringify(runtime));
    }
    assert("map-has-five-landmarks",true);
    click(d.querySelector("#landmarks .landmark"),"first-landmark");
    await wait(80);
    click(d.querySelector("#startBtn"),"start-writing");
    await wait(250);
    assert("writing-view-active",d.querySelector("#explore")?.classList.contains("active")===true);
    assert("active-writing-blocks-pwa-activation",w.SnapPopPwaSafePoint?.()===false);

    const answer=d.querySelector("#answer"),next=d.querySelector("#nextBtn");
    answer.value="오늘은 숲에서 작은 빛을 봤어.";
    answer.dispatchEvent(new Event("input",{bubbles:true}));
    click(next,"writing-step-1");
    await wait(160);
    assert("writing-step-2-active",d.querySelectorAll("#steps .on")[0]?.textContent?.includes("2.")===true);

    answer.value="오늘은 숲에서 작은 빛을 봤어. 가까이 가니 잎 사이에서 반짝였어.";
    answer.dispatchEvent(new Event("input",{bubbles:true}));
    click(next,"writing-step-2");
    await wait(160);
    assert("writing-step-3-active",d.querySelectorAll("#steps .on")[0]?.textContent?.includes("3.")===true);

    answer.value="오늘은 숲에서 작은 빛을 봤어. 가까이 가니 잎 사이에서 반짝였어. 다음에도 천천히 살펴보고 싶어.";
    answer.dispatchEvent(new Event("input",{bubbles:true}));
    click(next,"writing-complete");
    await wait(500);
    assert("writing-result-active",d.querySelector("#result")?.classList.contains("active")===true);
    assert("completed-writing-reopens-pwa-safe-point",w.SnapPopPwaSafePoint?.()===true);
    const envelope=w.SnapPopBridge.emit("TASK_PROGRESS",{sharedRuntimeSmoke:true});
    assert("shared-event-envelope-valid",w.TakyEventEnvelope.validate(envelope).ok===true);

    click(d.querySelector("#familyExpansionBtn"),"family-open");
    await wait(180);
    assert("family-view-active",d.querySelector("#familyExpansion")?.classList.contains("active")===true);
    assert("family-is-subflow-nav-hidden",d.querySelector("#nav")?.hidden===true);

    const toggle=d.querySelector("#familyExpansionToggle");
    toggle.checked=true;
    toggle.dispatchEvent(new Event("change",{bubbles:true}));
    await wait(120);
    assert("family-mode-enabled",d.querySelector("#familyExpansionMode")?.textContent==="FAMILY_EXPANSION");

    const name=d.querySelector("#familyChildName");
    name.value="런타임아이";
    click(d.querySelector("#familyChildAdd"),"family-child-add");
    await wait(180);
    assert("family-child-created",d.querySelector("#familyChildSelect")?.value?.startsWith("child_")===true);

    const diary=d.querySelector("#familyDiaryText");
    diary.value="오늘 가족과 함께 작은 탐험을 했다.";
    click(d.querySelector("#familyDiarySave"),"family-diary-save");
    await wait(220);
    assert("family-diary-in-timeline",d.querySelector("#familyTimeline")?.textContent?.includes("오늘 가족과 함께 작은 탐험을 했다.")===true);
    assert("family-conflict-lock-visible",d.querySelector("#familyFeatureGrid")?.textContent?.includes("CONFLICT_LOCKED")===true);
    assert("family-recovery-lock-visible",d.querySelector("#familyFeatureGrid")?.textContent?.includes("RECOVERY_LOCKED")===true);

    document.body.dataset.status="PASS";
    result.textContent+="\nBROWSER_RUNTIME_SMOKE_PASS";
  }catch(error){
    document.body.dataset.status="FAIL";
    result.textContent+="\nBROWSER_RUNTIME_SMOKE_FAIL "+(error&&error.message?error.message:String(error));
  }
}
run();
</script>
</body></html>
