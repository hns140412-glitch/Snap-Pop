name: Companion Onboarding Source/Asset Gate

on:
  pull_request:
    paths:
      - 'onboarding/**'
      - '.github/workflows/companion-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-asset-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify approved visual assets and V2 runtime/shell separation (fail closed)
        run: node onboarding/tests/asset-integrity-v2.cjs
      - name: Verify pinned TAKY-ASSETS source pointer and local PWA asset copies
        run: node onboarding/tests/central-asset-source.cjs
      - name: Verify Explorer Crew Runtime V2 single-owner integration
        run: |
          node onboarding/tests/explorer-crew-v2-source-lock.cjs
          node onboarding/tests/explorer-crew-system-v2.cjs
          node onboarding/tests/snap-explorer-runtime-v2-live-contract.cjs
          node onboarding/tests/explorer-crew-approved-personality-board.cjs
          node onboarding/tests/explorer-crew-24-companion-switch.cjs
          node onboarding/tests/explorer-crew-role-behavior-integration.cjs
          node onboarding/tests/explorer-crew-semantic-compat.cjs
          node onboarding/tests/explorer-crew-runtime-policy-wired.cjs
          node onboarding/tests/explorer-crew-story-gate-wired.cjs
          node onboarding/tests/explorer-crew-runtime-log-wired.cjs
          node onboarding/tests/explorer-crew-asset-render-wired.cjs
          node onboarding/tests/explorer-crew-e2e-core-flow.cjs
          node onboarding/tests/explorer-crew-initial-selection-removal.cjs
          node onboarding/tests/relation-asset-separation-smoke.cjs
      - name: Verify Core 6 identity, onboarding scope and non-promotion boundaries
        run: node onboarding/tests/crew-contract.cjs
      - name: Verify immutable crew identity, history and evidence boundaries
        run: node onboarding/tests/crew-state-runtime.cjs
      - name: Verify sourced Core 6 behavior projection and no silent authority transfer
        run: node onboarding/tests/crew-behavior-runtime.cjs
      - name: Verify Behavior / Asset / Integration gates and composable Manifest bridge
        run: node onboarding/tests/crew-engine-pipeline.cjs
      - name: Verify reaction budget, interruptibility, repetition guard, dialogue intent and scene slots
        run: node onboarding/tests/crew-runtime-policy.cjs
      - name: Verify composable 7-group readiness and emit fail-closed report
        run: |
          node onboarding/tests/crew-composable-readiness.cjs
          node onboarding/crew-composable-readiness.js --out onboarding/qa/crew-composable-readiness.json > /dev/null
          cat onboarding/qa/crew-composable-readiness.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: crew-composable-7-group-readiness
          path: onboarding/qa/crew-composable-readiness.json
          if-no-files-found: error
      - name: Build current composable work queue without generating art
        run: |
          node onboarding/tests/crew-composable-work-queue.cjs
          node onboarding/crew-composable-work-queue.js --out onboarding/qa/crew-composable-work-queue.json > /dev/null
          cat onboarding/qa/crew-composable-work-queue.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: crew-composable-current-work-queue
          path: onboarding/qa/crew-composable-work-queue.json
          if-no-files-found: error
      - name: Verify Core6 P0 production contract remains fail-closed until real approved files exist
        run: |
          node onboarding/tests/crew-p0-production-gate.cjs
          node onboarding/crew-p0-production-gate.js --out onboarding/qa/crew-p0-production-gate.json > /dev/null
          cat onboarding/qa/crew-p0-production-gate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: crew-core6-p0-production-gate
          path: onboarding/qa/crew-p0-production-gate.json
          if-no-files-found: error
      - name: Verify P0 registration tool cannot promote missing/unapproved files
        run: |
          node onboarding/tests/crew-p0-register.cjs
          node onboarding/crew-p0-register.js --mode audit > onboarding/qa/crew-p0-registration-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: crew-core6-p0-registration-audit
          path: onboarding/qa/crew-p0-registration-audit.json
          if-no-files-found: error
      - name: Verify Visual ID to asset/scene/interaction production gate (fail closed)
        run: node onboarding/tests/visual-id-production.cjs
      - name: Verify Visual ID registration-to-UI production workflow and repeatable work orders
        run: |
          node onboarding/tests/visual-id-workflow.cjs
          node onboarding/tools/visual-id-workflow.cjs report > onboarding/visual-id-work-order-report.json
          cat onboarding/visual-id-work-order-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-id-work-orders
          path: onboarding/visual-id-work-order-report.json
          if-no-files-found: error
      - name: Verify explicit child-authored Crew turns and hint consent
        run: node onboarding/tests/crew-interaction-runtime.cjs
      - name: Verify Visual ID to actual approved art in HOME radio (6 members x 3 states; new ID fallback gate)
        run: node onboarding/tests/crew-visual-presenter.cjs
      - name: Verify explicit primary selection, rename and reload recovery
        run: node onboarding/tests/primary-selection.cjs

  core6-source-pixel-partition-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned alpha-image verification library
        run: python -m pip install 'Pillow==12.0.0'
      - name: Verify six immutable Visual IDs, clean alpha payload and byte-exact visible original pixel reconstruction
        run: python onboarding/tests/source-layer-extraction.py
      - name: Preflight batch Visual ID provenance, duplicate rejection and 24 technical slots
        run: python onboarding/tests/visual-id-batch.py
      - name: Verify LEGACY 3+6 nine-slot source/provenance regression only (production authority disabled)
        run: |
          python onboarding/tests/visual-id-art-batch.py
          python onboarding/tools/visual-id-art-batch.py --mode plan --out onboarding/qa/visual-id-art-batch-plan.json > /dev/null
          python onboarding/tools/visual-id-art-batch.py --mode audit --out onboarding/qa/visual-id-art-batch-audit.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-core6-3-plus-6-regression-work-orders-no-production-authority
          path: |
            onboarding/qa/visual-id-art-batch-plan.json
            onboarding/qa/visual-id-art-batch-audit.json
          if-no-files-found: error
      - name: Verify GUIDE pipeline resume state
        run: python onboarding/tests/guide-pipeline-resume-state.py
      - name: Verify logic-only hold policy while image generation is unavailable
        run: |
          python onboarding/tests/visual-id-logic-only-mode.py
          python onboarding/tools/visual-id-logic-only-mode.py --action VALIDATE_STATE_MACHINE
          ! python onboarding/tools/visual-id-logic-only-mode.py --action BODY_PROP_GEAR_FINAL_ART
      - name: Verify GUIDE 07..24 source provenance only; legacy full24 production remains disabled
        run: |
          python onboarding/tools/guide-group-intake.py
          python onboarding/tests/guide-group-intake.py
          python onboarding/tests/visual-id-source-readiness.py
          python onboarding/tools/visual-id-source-readiness.py --out onboarding/qa/visual-id-24-source-readiness.json > /dev/null
          python onboarding/tools/visual-id-art-batch.py --mode plan --scope full24 --out onboarding/qa/guide-24-legacy-regression-plan.json > /dev/null
          python onboarding/tools/visual-id-art-batch.py --mode audit --scope full24 --out onboarding/qa/guide-24-legacy-regression-audit.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: guide-07-24-provenance-and-legacy-216-regression-evidence-production-disabled
          path: |
            onboarding/qa/visual-id-24-source-readiness.json
            onboarding/qa/guide-24-legacy-regression-plan.json
            onboarding/qa/guide-24-legacy-regression-audit.json
          if-no-files-found: error
      - name: Batch build per-Visual-ID approved-source partition drafts (never activate)
        run: |
          python onboarding/tools/visual-id-batch.py --root onboarding --out onboarding/visual-prototypes > onboarding/visual-id-batch-summary.json
          cat onboarding/visual-id-batch-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build original-source-bound individual restoration exposure guides; NOT painted underlays
        run: |
          python onboarding/tools/visual-id-occlusion-qa.py --source-root onboarding/characters/ui_cutouts --layer-root onboarding/visual-prototypes --spec-root onboarding/characters/layer_specs --out onboarding/occlusion-qa
          python onboarding/tests/visual-id-occlusion-qa.py
      - name: Install pinned local-inpainting trial (no Codex and no external image calls)
        run: python -m pip install opencv-python-headless==4.13.0.92
      - name: Build source-local per-Visual-ID six partial underpaint QA drawings and 12 actual shifted before/after PNG pairs
        run: |
          python onboarding/tools/visual-id-partial-underpaint-qa.py --source-root onboarding/characters/ui_cutouts --layer-root onboarding/visual-prototypes --exposure-root onboarding/occlusion-qa --out onboarding/underpaint-qa
          python onboarding/tests/visual-id-partial-underpaint-qa.py
      - name: Simulate a real seventh staged ID and validate capacity 24 (reject 25th)
        run: python onboarding/tests/visual-id-staged-integration.py
      - name: Bundle REAL approved Core6 original layers into isolated interactive QA preview
        run: |
          python onboarding/tools/build-core6-motion-preview.py --root onboarding --out onboarding/qa-original-rig
          python onboarding/tests/core6-motion-preview-build.py
      - name: Browser-test six real approved image sets (no production route)
        run: |
          node --check onboarding/tests/core6-motion-preview.spec.js
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p onboarding/qa-original-rig/render-evidence
          python3 -m http.server 4197 --bind 127.0.0.1 --directory onboarding/qa-original-rig > /tmp/core6-rig.log 2>&1 &
          npx playwright test onboarding/tests/core6-motion-preview.spec.js --reporter=line --workers=1
      - name: Check six real original layer trajectories at all nine interpolated positions (QA only)
        run: |
          python onboarding/tools/core6-nine-pose-qa.py
          python onboarding/tests/core6-nine-pose-qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: core6-six-real-original-nine-pose-webp-and-extended-inferred-underpaint-QA-HOLD
          path: onboarding/qa-nine-pose/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: core6-six-actual-approved-originals-18-visible-layers-6-partial-underpaint-interactive-QA-HOLD
          path: onboarding/qa-original-rig/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: core6-six-partial-source-local-underpaint-drafts-12-poses-artistic-hold
          path: onboarding/underpaint-qa/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: core6-six-visual-id-twelve-exposure-masks-qa-not-restored-art
          path: onboarding/occlusion-qa/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: core6-six-source-pixel-partition-prototypes-not-release-art
          path: |
            onboarding/visual-prototypes/
            onboarding/visual-id-batch-summary.json
          if-no-files-found: error
