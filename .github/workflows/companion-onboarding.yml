name: Companion Onboarding Source/Asset Gate

on:
  pull_request:
    paths:
      - 'onboarding/**'
      - '.github/workflows/companion-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-asset-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact original assets (fail closed)
        run: node onboarding/tests/asset-integrity.cjs
      - name: Verify Core 6 identity, onboarding scope and non-promotion boundaries
        run: node onboarding/tests/crew-contract.cjs
      - name: Verify immutable crew identity, history and evidence boundaries
        run: node onboarding/tests/crew-state-runtime.cjs
      - name: Verify sourced Core 6 behavior projection and no silent authority transfer
        run: node onboarding/tests/crew-behavior-runtime.cjs
      - name: Verify explicit primary selection, rename and reload recovery
        run: node onboarding/tests/primary-selection.cjs
