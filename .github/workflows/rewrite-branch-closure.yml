name: Snap Pop Rewrite Closure

on:
  push:
    branches:
      - taky/snap-pop-implementation-2026-09-20

permissions:
  contents: write

jobs:
  rewrite-closure:
    if: ${{ !contains(github.event.head_commit.message, '[skip-closure]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact candidate and persist evidence
        shell: bash
        run: |
          set +e
          SHA="${GITHUB_SHA}"
          ACTUAL="$(git rev-parse HEAD)"
          node scripts/validate-branch-closure.mjs > /tmp/closure.log 2>&1
          CLOSURE_STATUS=$?

          python3 -m http.server 4173 >/tmp/snap-pop-http.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1; then break; fi
            sleep 0.1
          done

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "BROWSER_RUNTIME_INFRA_BLOCKED no chromium browser" > /tmp/browser.log
            BROWSER_STATUS=2
          else
            PROFILE_DIR="/tmp/snap-pop-chrome-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$PROFILE_DIR"
            launch_browser() {
              local HEADLESS_MODE="$1"
              "$BROWSER" "$HEADLESS_MODE" --disable-gpu --no-sandbox --disable-dev-shm-usage --window-size=390,844 \
                --remote-debugging-address=127.0.0.1 \
                --remote-debugging-port=9222 \
                --user-data-dir="$PROFILE_DIR" \
                "http://127.0.0.1:4173/index.html?runtime-smoke=1" \
                >/tmp/snap-pop-chrome.log 2>&1 &
              BROWSER_PID=$!
            }

            launch_browser "--headless=new"
            BROWSER_READY=0
            for i in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then BROWSER_READY=1; break; fi
              if ! kill -0 "$BROWSER_PID" 2>/dev/null; then break; fi
              sleep 0.1
            done

            if [ "$BROWSER_READY" -ne 1 ]; then
              kill "$BROWSER_PID" 2>/dev/null || true
              echo "--- first chrome launch failed; retrying alternate headless mode ---" >> /tmp/snap-pop-chrome.log
              rm -rf "$PROFILE_DIR"
              launch_browser "--headless"
              for i in $(seq 1 120); do
                if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then BROWSER_READY=1; break; fi
                if ! kill -0 "$BROWSER_PID" 2>/dev/null; then break; fi
                sleep 0.1
              done
            fi

            if [ "$BROWSER_READY" -ne 1 ]; then
              {
                echo "BROWSER_RUNTIME_INFRA_BLOCKED chrome debugging port unavailable"
                echo "--- CHROME LOG ---"
                cat /tmp/snap-pop-chrome.log
              } > /tmp/browser.log
              BROWSER_STATUS=2
            else
              node scripts/browser-runtime-cdp.mjs > /tmp/browser.log 2>&1
              BROWSER_STATUS=$?
            fi
            kill "$BROWSER_PID" 2>/dev/null || true
          fi
          kill "$SERVER_PID" 2>/dev/null || true

          mkdir -p VALIDATION
          CLOSURE_MARKER="$(grep -E 'BRANCH_CLOSURE_VALIDATOR_PASS [0-9]+/[0-9]+' /tmp/closure.log | tail -1 || true)"
          BROWSER_MARKER="$(grep -E 'BROWSER_RUNTIME_CDP_PASS' /tmp/browser.log | tail -1 || true)"
          cat > VALIDATION/SNAP_POP_REWRITE_CLOSURE_LATEST.txt <<EOF
          validation_sha=$SHA
          checkout_sha=$ACTUAL
          closure_status=$CLOSURE_STATUS
          closure_marker=$CLOSURE_MARKER
          browser_status=$BROWSER_STATUS
          browser_marker=$BROWSER_MARKER
          viewport=390x844
          generated_by=github-actions-branch-only
          EOF

          cat /tmp/closure.log >> VALIDATION/SNAP_POP_REWRITE_CLOSURE_LATEST.txt
          echo "--- BROWSER ---" >> VALIDATION/SNAP_POP_REWRITE_CLOSURE_LATEST.txt
          cat /tmp/browser.log >> VALIDATION/SNAP_POP_REWRITE_CLOSURE_LATEST.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VALIDATION/SNAP_POP_REWRITE_CLOSURE_LATEST.txt
          git commit -m "Record rewrite closure evidence [skip-closure]"
          git push origin HEAD:taky/snap-pop-implementation-2026-09-20

          if [ "$SHA" != "$ACTUAL" ] || [ "$CLOSURE_STATUS" -ne 0 ] || [ "$BROWSER_STATUS" -ne 0 ]; then
            exit 1
          fi
