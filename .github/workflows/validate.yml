name: Validate Snap & Pop

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check snap-bridge.js
          node --check snap-release-v01.js
          node --check snap-pwa-update-v01.js
          node --check vendor/taky/release-contract.js
          node --check vendor/taky/pwa-update-state.js
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Validate Snap human-rubric verification adapter
        run: node tests/snap-rubric-verifier.test.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/snap-http.log 2>&1 &
          echo $! > /tmp/snap-http.pid
      - name: Run shared runtime browser regression
        run: npx playwright test tests/shared-runtime.spec.js --reporter=line
      - name: Start temporary self-signed HTTPS loopback for secure-origin QA
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/companion-local.key -out /tmp/companion-local.crt -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" > /dev/null 2>&1
          python3 onboarding/tests/https-server.py /tmp/companion-local.crt /tmp/companion-local.key > /tmp/companion-https.log 2>&1 &
          echo $! > /tmp/companion-https.pid
          curl -k -fsS --retry 20 --retry-connrefused --retry-delay 1 https://127.0.0.1:4174/onboarding/ > /dev/null
      - name: Run isolated companion browser journeys at four viewports
        run: npx playwright test onboarding/tests/browser.spec.js --reporter=line
      - name: Verify isolated HTTPS IndexedDB photo-source persistence and clearing
        run: npx playwright test onboarding/tests/secure-origin.spec.js --reporter=line
      - name: Verify all twelve captured states at four viewport sizes
        run: |
          test "$(find onboarding/render-evidence -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 48
      - name: Upload companion candidate render evidence (not visual approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-render-candidate
          path: onboarding/render-evidence/*.png
          if-no-files-found: error
          retention-days: 7
