name: Validate Snap & Pop

on:
  pull_request:
  push:
    branches: ["main", "taky/app-execution-context-bridge-2026-09-25", "taky/family-member-scope-isolation-2026-09-25"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check snap-bridge.js
          node --check snap-release-v01.js
          node --check snap-pwa-update-v01.js
          node --check vendor/taky/release-contract.js
          node --check vendor/taky/pwa-update-state.js
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Validate app execution context bridge
        run: node tests/app-execution-context-bridge.test.js
      - name: Validate family member scope isolation
        run: node tests/family-member-scope-isolation.test.js
      - name: Validate Snap human-rubric verification adapter
        run: node tests/snap-rubric-verifier.test.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/snap-http.log 2>&1 &
          echo $! > /tmp/snap-http.pid
      - name: Run shared runtime browser regression
        run: npx playwright test tests/shared-runtime.spec.js --reporter=line
