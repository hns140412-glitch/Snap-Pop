name: Snap Pop Branch Closure

on:
  push:
    branches:
      - taky/snap-pop-implementation-2026-09-20
      - taky/learning-app-family-snap-context-2026-09-21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show candidate SHA
        run: echo "SNAP_POP_VALIDATION_SHA=${GITHUB_SHA}"
      - name: Run 44 branch closure validators
        run: node scripts/validate-branch-closure.mjs

      - name: Validate Ready learning-context contract
        run: node scripts/validate-ready-learning-context.mjs

      - name: Validate shared runtime reconciliation
        run: node tests/shared-runtime-contract.test.js

      - name: Syntax-check integrated Snap runtime
        run: |
          node --check app.js
          node --check snap-bridge.js
          node --check snap-pwa-update-v01.js
          node --check snap-release-v01.js
          node --check vendor/taky/event-envelope.js
          node --check vendor/taky/pwa-update-state.js
          node --check vendor/taky/release-contract.js

      - name: Browser runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/snap-pop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "BROWSER_RUNTIME_INFRA_BLOCKED no chromium browser"
            exit 2
          fi
          "$BROWSER" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage             --virtual-time-budget=12000 --dump-dom             http://127.0.0.1:4173/scripts/browser-runtime-smoke.html             > /tmp/snap-pop-browser-smoke.html
          cat /tmp/snap-pop-browser-smoke.html
          grep -q '<body data-status="PASS">' /tmp/snap-pop-browser-smoke.html
