name: Snap Pop Branch Closure

on:
  push:
    branches:
      - taky/snap-pop-implementation-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show candidate SHA
        run: echo "SNAP_POP_VALIDATION_SHA=${GITHUB_SHA}"
      - name: Run 56 branch closure validators
        run: node scripts/validate-branch-closure.mjs

      - name: Browser runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/snap-pop-http.log 2>&1 &
          SERVER_PID=$!
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "BROWSER_RUNTIME_INFRA_BLOCKED no chromium browser"
            exit 2
          fi
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --window-size=390,844 \
            --remote-debugging-port=9222 \
            "http://127.0.0.1:4173/index.html?runtime-smoke=1" \
            >/tmp/snap-pop-chrome.log 2>&1 &
          BROWSER_PID=$!
          trap 'kill $BROWSER_PID $SERVER_PID 2>/dev/null || true' EXIT
          if ! node scripts/browser-runtime-cdp.mjs; then
            echo "=== CHROME LOG ==="
            cat /tmp/snap-pop-chrome.log || true
            echo "=== HTTP LOG ==="
            cat /tmp/snap-pop-http.log || true
            exit 1
          fi
