name: Snap Pop Branch Closure

on:
  push:
    branches:
      - taky/snap-pop-implementation-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show candidate SHA
        run: echo "SNAP_POP_VALIDATION_SHA=${GITHUB_SHA}"
      - name: Run 61 branch closure validators
        run: node scripts/validate-branch-closure.mjs

      - name: Browser runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/snap-pop-http.log 2>&1 &
          SERVER_PID=$!
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "BROWSER_RUNTIME_INFRA_BLOCKED no chromium browser"
            exit 2
          fi
          PROFILE_DIR="/tmp/snap-pop-chrome-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$PROFILE_DIR"
          launch_browser() {
            local HEADLESS_MODE="$1"
            "$BROWSER" "$HEADLESS_MODE" --disable-gpu --no-sandbox --disable-dev-shm-usage --window-size=390,844 \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9222 \
              --user-data-dir="$PROFILE_DIR" \
              "http://127.0.0.1:4173/index.html?runtime-smoke=1" \
              >/tmp/snap-pop-chrome.log 2>&1 &
            BROWSER_PID=$!
          }
          launch_browser "--headless=new"
          trap 'kill $BROWSER_PID $SERVER_PID 2>/dev/null || true' EXIT
          BROWSER_READY=0
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then BROWSER_READY=1; break; fi
            if ! kill -0 "$BROWSER_PID" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [ "$BROWSER_READY" -ne 1 ]; then
            kill "$BROWSER_PID" 2>/dev/null || true
            echo "--- first chrome launch failed; retrying alternate headless mode ---" >> /tmp/snap-pop-chrome.log
            rm -rf "$PROFILE_DIR"
            launch_browser "--headless"
            for i in $(seq 1 300); do
              if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then BROWSER_READY=1; break; fi
              if ! kill -0 "$BROWSER_PID" 2>/dev/null; then break; fi
              sleep 0.1
            done
          fi
          if [ "$BROWSER_READY" -ne 1 ]; then
            echo "BROWSER_RUNTIME_INFRA_BLOCKED chrome debugging port unavailable"
            echo "=== CHROME LOG ==="
            cat /tmp/snap-pop-chrome.log || true
            exit 2
          fi
          if ! timeout 90s node scripts/browser-runtime-cdp.mjs; then
            echo "=== CHROME LOG ==="
            cat /tmp/snap-pop-chrome.log || true
            echo "=== HTTP LOG ==="
            cat /tmp/snap-pop-http.log || true
            exit 1
          fi
