name: Snap Pop Branch Closure

on:
  push:
    branches:
      - taky/snap-pop-implementation-2026-09-20
      - taky/learning-app-family-snap-reconcile-2026-09-21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show candidate SHA
        run: echo "SNAP_POP_VALIDATION_SHA=${GITHUB_SHA}"
      - name: Run branch closure validators
        run: node scripts/validate-branch-closure.mjs

  shared-foundation-reconciliation:
    if: github.ref_name == 'taky/learning-app-family-snap-reconcile-2026-09-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Validate vocabulary ownership boundary
        run: node scripts/validate-vocabulary-material-ownership.mjs
      - name: Validate Learning App Family context alignment
        run: node scripts/validate-learning-app-family-context.mjs
      - name: Check reconciled JavaScript syntax
        run: |
          node --check app.js
          node --check snap-bridge.js
          node --check snap-release-v01.js
          node --check snap-pwa-update-v01.js
          node --check vendor/taky/release-contract.js
          node --check vendor/taky/pwa-update-state.js
          node --check vendor/taky/event-envelope.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/snap-http.log 2>&1 &
          echo $! > /tmp/snap-http.pid
      - name: Run shared runtime browser regression
        run: npx playwright test tests/shared-runtime.spec.js --reporter=line
