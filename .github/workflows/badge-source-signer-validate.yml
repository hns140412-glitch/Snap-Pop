name: Validate Badge Source Signer

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-badge-source-signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check badge source helper syntax
        run: |
          node --check taky-badge-source-signer-v01.js
          node --check taky-badge-source-identity-v01.js
          node --check writing-flow-controller.js
          node --check interaction-support-controller.js
          node scripts/validate-badge-deep-thinking-persistence.mjs
