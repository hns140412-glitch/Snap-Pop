[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"

[[redirects]]
  from = "/api/snap-pop-semantic-writing"
  to = "/.netlify/functions/snap-pop-semantic-writing"
  status = 200
  force = true
