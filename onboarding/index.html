function cancelCrewRename(){state.renameEditingId='';render()}
function commitCrewRename(id){if(!state.crew.includes(id)||state.renameEditingId!==id)return;const field=el.querySelector('[data-crew-rename="'+id+'"]');if(!field)return;
  try{state.crewLedger=crewLogic.rename(state.crewLedger,id,field.value);state.renameEditingId='';save();render()}
  catch(e){const status=el.querySelector('.crew-rename-status');if(status)status.textContent='이름을 입력해 주세요.'}
}
function toggleCrew(id){if(state.step!==2||state.selectionPhase!=='crew'||!people.some(x=>x[0]===id))return;
  if(state.crew.includes(id))state.crew=state.crew.filter(x=>x!==id);else if(state.crew.length<6)state.crew.push(id);
  if(state.primaryCompanionId&&!state.crew.includes(state.primaryCompanionId)){state.crewLedger=crewLogic.clearPrimary(state.crewLedger,state.primaryCompanionId);state.primaryCompanionId='';}
  save();render()
}let picked=null;function pickItem(id){picked=id;document.querySelectorAll('.object').forEach(e=>e.classList.toggle('picked',e.dataset.item===id));document.getElementById('packhint').textContent='선택한 물건을 가방으로 옮겨주세요.'}function packPicked(){if(picked)packItem(picked)}function packItem(id){if(!['map','lamp','water','camera','cap','compass'].includes(id))return;if(!state.items.includes(id))state.items.push(id);picked=null;save();render()}render();
</script></body></html>
